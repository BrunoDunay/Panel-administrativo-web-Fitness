<app-panel-ui-styles />
<app-confirm-dialog />
<div class="shell" [class.menu-open]="menuOpen()">
  <aside class="aside" aria-label="Menú del panel">
    <a class="brand" routerLink="/panel" aria-label="Inicio del panel">
      <img src="/brand/mark-light.png" alt="" width="640" height="356" />
      <span class="brand__name display">Fitness by Evidence</span>
    </a>

    <nav class="nav">
      @for (group of nav; track group.title) {
        <p class="nav__group">{{ group.title }}</p>
        <ul>
          @for (item of group.items; track item.path) {
            <li>
              <a class="nav__link" [routerLink]="item.path" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: item.path === '/panel' }">
                <span class="nav__icon"><app-icon [name]="item.icon" [size]="18" /></span>
                {{ item.label }}
              </a>
            </li>
          }
        </ul>
      }
    </nav>

    <div class="aside__footer">
      <a class="nav__link" routerLink="/" target="_blank" rel="noopener">
        <span class="nav__icon"><app-icon name="external" [size]="18" /></span>
        Ver sitio
      </a>
      <div class="account">
        <span class="account__avatar">{{ initials(auth.admin()?.name ?? '') }}</span>
        <span class="account__name">{{ auth.admin()?.name }}</span>
        <button type="button" class="account__logout" (click)="auth.logout()" aria-label="Cerrar sesión" title="Cerrar sesión">
          <app-icon name="logout" [size]="18" />
        </button>
      </div>
    </div>
  </aside>

  <button type="button" class="scrim" aria-label="Cerrar menú" (click)="menuOpen.set(false)"></button>

  <div class="main-col">
    <header class="topbar">
      <button type="button" class="menu-btn" (click)="menuOpen.set(!menuOpen())" [attr.aria-expanded]="menuOpen()" aria-label="Abrir menú">
        <app-icon name="menu" [size]="22" />
      </button>
      <img src="/brand/mark.png" alt="Fitness by Evidence" width="640" height="356" />
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
