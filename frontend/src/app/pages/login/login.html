<section class="login">
  <div class="card fade-up">
    <header class="brand">
      <img src="/brand/mark.png" alt="" width="640" height="356" />
      <span class="brand__name display">Fitness by Evidence</span>
    </header>

    <h1 class="title">Panel del coach</h1>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label class="field__label" for="email">Email</label>
        <input id="email" class="field__control" type="email" formControlName="email" autocomplete="username" [attr.aria-invalid]="invalid('email')" aria-describedby="email-error" />
        @if (invalid('email')) {
          <span id="email-error" class="field__error">Escribe un email válido.</span>
        }
      </div>

      <div class="field">
        <label class="field__label" for="password">Contraseña</label>
        <div class="password">
          <input
            id="password"
            class="field__control"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
            [attr.aria-invalid]="invalid('password')"
            aria-describedby="password-error"
          />
          <button type="button" class="toggle" (click)="showPassword.set(!showPassword())">
            {{ showPassword() ? 'Ocultar' : 'Mostrar' }}
          </button>
        </div>
        @if (invalid('password')) {
          <span id="password-error" class="field__error">Escribe tu contraseña.</span>
        }
      </div>

      @if (error()) {
        <p class="alert" role="alert">{{ error() }}</p>
      }

      <button appBtn type="submit" size="lg" [block]="true" [loading]="loading()" [disabled]="loading()">Entrar</button>
    </form>

    <a class="back" routerLink="/">← Volver al sitio</a>
  </div>
</section>
